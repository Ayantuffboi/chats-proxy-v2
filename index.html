<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat's Proxy v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d0b;--panel:#141c17;--panel2:#1b261e;--line:#34453a;--green:#63f36b;--text:#f2f7f3;--muted:#9eada2;--red:#ff737b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#1b3020 0%,#0a0f0c 50%,#070907 100%);color:var(--text);font-family:'Kode Mono',monospace;min-height:100vh}button,input{font:inherit}button{color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer}button:hover{border-color:var(--green);background:#26372a}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.shell{min-height:100vh;display:grid;grid-template-columns:225px 1fr;grid-template-rows:82px 1fr 48px}header{grid-column:1/3;display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid #253329;gap:14px}.logo{width:46px;height:46px;border:2px solid var(--green);border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:25px}.brand h1{margin:0;font-size:21px}.brand p{margin:4px 0 0;color:var(--muted);font-size:10px}.status{margin-left:auto;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:7px;box-shadow:0 0 10px var(--green)}
aside{padding:18px 12px;border-right:1px solid #253329;display:flex;flex-direction:column;gap:8px}.nav{width:100%;text-align:left;background:transparent;border-color:transparent;display:flex;gap:12px;align-items:center;font-size:12px;padding:13px}.nav.active{border-color:var(--green);background:linear-gradient(100deg,#17351d,#17231a)}.nav span:first-child{font-size:18px;width:22px;text-align:center}.sidefoot{margin-top:auto;color:#829187;font-size:9px;line-height:1.8;padding:10px}
main{padding:20px;min-width:0}.topline{display:flex;align-items:center;gap:8px;margin-bottom:16px}.topline h2{font-size:15px;margin:0}.topline small{color:var(--muted);font-size:10px;margin-left:auto}.content{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#141c17,#0e140f);min-height:calc(100vh - 190px);padding:25px;overflow:auto}
.hero{text-align:center;padding:35px 10px 25px}.hero .symbol{font-size:38px;color:var(--green)}.hero h2{font-size:25px;margin:12px 0}.hero p{font-size:11px;color:var(--muted);line-height:1.8;max-width:620px;margin:0 auto}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:850px;margin:12px auto}.tile{min-height:112px;text-align:left;padding:17px;background:linear-gradient(140deg,#202d23,#141b16)}.tile strong{display:block;color:var(--green);font-size:12px;margin-bottom:9px}.tile small{font-size:10px;color:var(--muted);line-height:1.6}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;background:#101712}.card h3{font-size:13px;margin:0 0 10px}.card p,.card li{font-size:11px;color:var(--muted);line-height:1.8}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row label{font-size:11px;color:var(--muted);flex:1}.row input{background:#0b100d;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px;min-width:0}.keyinput{width:180px}.primary{background:#1b4a24;border-color:var(--green)}.danger{border-color:#744047;color:#ffb4b8}.hint{font-size:10px;color:var(--muted)}.keyrow{display:grid;grid-template-columns:1fr 190px auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #29352d;font-size:11px}.keyrow:last-child{border:0}.keyrow input{width:100%;background:#0b100d;color:white;border:1px solid var(--line);border-radius:8px;padding:9px}.keyrow button{font-size:10px}
.result{font-size:11px;padding:10px;border-radius:8px;margin:8px 0;background:#101712;border:1px solid var(--line)}.ok{color:var(--green)}.bad{color:var(--red)}
footer{grid-column:1/3;border-top:1px solid #253329;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:var(--muted);font-size:9px}.keys{display:flex;gap:16px;flex-wrap:wrap}.keys b{color:var(--green);border:1px solid #536b58;padding:3px 6px;border-radius:5px;margin-right:5px}
.toast{display:none;position:fixed;right:20px;bottom:65px;padding:12px 15px;background:#1c2b20;border:1px solid var(--green);border-radius:9px;font-size:11px;z-index:5;max-width:330px}
@media(max-width:720px){.shell{grid-template-columns:1fr;grid-template-rows:72px auto 1fr 55px}header{grid-column:1;padding:10px 14px}.brand h1{font-size:17px}aside{flex-direction:row;overflow:auto;padding:7px;border-right:0;border-bottom:1px solid #253329}.nav{white-space:nowrap;width:auto;padding:9px}.sidefoot{display:none}main{padding:12px}.content{padding:14px;min-height:65vh}.tiles{grid-template-columns:1fr 1fr}.keyrow{grid-template-columns:1fr 130px}.keyrow button{grid-column:2}.status{font-size:9px}footer{padding:8px 12px}.keys{gap:7px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="logo">◎</div><div class="brand"><h1>Chat's Proxy</h1><p>WEB WORKSPACE · SECURITY LAB EDITION</p></div><div class="status"><span class="dot"></span><span id="serverStatus">CHECKING SERVER</span>　|　v2.0.0</div></header>
<aside>
<button class="nav active" data-page="home"><span>⌂</span>Home</button>
<button class="nav" data-page="launch"><span>↗</span>Open Website</button>
<button class="nav" data-page="diagnostics"><span>⌁</span>Diagnostics</button>
<button class="nav" data-page="history"><span>◷</span>History</button>
<button class="nav" data-page="bookmarks"><span>☆</span>Bookmarks</button>
<button class="nav" data-page="settings"><span>⚙</span>Settings / Keybinds</button>
<button class="nav" data-page="about"><span>ⓘ</span>About</button>
<div class="sidefoot">KODE MONO UI<br>Keyboard shortcuts are editable<br>and saved on this device.</div>
</aside>
<main><div class="topline"><h2 id="pageTitle">HOME</h2><small id="clockLabel">CHAT'S PROXY WORKSPACE</small></div><section class="content" id="content"></section></main>
<footer><div class="keys"><span><b>A</b>Select</span><span><b>Esc</b>Back</span><span><b>Ctrl+L</b>Address</span><span><b>Ctrl+,</b>Settings</span></div><span>CHAT'S PROXY · v2.0.0</span></footer>
</div><div class="toast" id="toast"></div>
<script>
const defaults={newTab:'Ctrl+T',closeTab:'Ctrl+W',back:'Alt+ArrowLeft',forward:'Alt+ArrowRight',refresh:'Ctrl+R',focusAddress:'Ctrl+L',home:'Alt+Home',settings:'Ctrl+,'};
let bindings={...defaults,...JSON.parse(localStorage.getItem('cp2_keys')||'{}')};
let page='home',historyItems=JSON.parse(localStorage.getItem('cp2_history')||'[]'),bookmarks=JSON.parse(localStorage.getItem('cp2_bookmarks')||'[]'),tabs=[{id:1,url:''}],active=0,nextId=2;
const $=s=>document.querySelector(s);
const labels={newTab:'New tab',closeTab:'Close active tab',back:'Go back',forward:'Go forward',refresh:'Refresh page',focusAddress:'Focus address bar',home:'Go home',settings:'Open settings'};
function toast(s){let el=$('#toast');el.textContent=s;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2600)}
function normKey(e){let p=[];if(e.ctrlKey)p.push('Ctrl');if(e.altKey)p.push('Alt');if(e.shiftKey)p.push('Shift');if(e.metaKey)p.push('Meta');let k=e.key;if(['Control','Alt','Shift','Meta'].includes(k))return '';if(k===' ')k='Space';if(k.startsWith('Arrow')){}else if(k.length===1)k=k.toUpperCase();p.push(k);return p.join('+')}
function keyMatches(e,combo){return normKey(e).toLowerCase()===combo.toLowerCase()}
function saveKeys(){localStorage.setItem('cp2_keys',JSON.stringify(bindings));toast('Keyboard shortcuts saved.')}
function setPage(p){page=p;render()}
function current(){return tabs[active]}
function openTab(url=''){tabs.push({id:nextId++,url});active=tabs.length-1;if(url)record(url);setPage('home');render()}
function closeTab(){if(tabs.length===1){tabs[0].url='';setPage('home')}else{tabs.splice(active,1);active=Math.max(0,active-1);setPage('home')}render()}
function record(url){historyItems.unshift({url,time:new Date().toLocaleString()});historyItems=historyItems.slice(0,100);localStorage.setItem('cp2_history',JSON.stringify(historyItems))}
function cleanUrl(raw){let s=raw.trim();if(!s)return '';if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)){s=s.includes('.')&&!s.includes(' ')?'https://'+s:'https://www.google.com/search?q='+encodeURIComponent(s)}try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function openWebsite(raw){let url=cleanUrl(raw);if(!url){toast('Enter a valid website or search.');return}current().url=url;record(url);window.open(url,'_blank','noopener,noreferrer');toast('Opened in a new browser tab. The destination remains visible to network filtering.');render()}
function homeHtml(){return `<div class="hero"><div class="symbol">◉</div><h2>Welcome to Chat's Proxy.</h2><p>An Xbox-inspired web workspace with customizable controls and server diagnostics. Websites open in a normal browser tab; this app does not disguise or relay blocked traffic.</p></div><div class="card"><h3>OPEN A WEBSITE</h3><div class="row"><input id="urlBox" style="flex:1" placeholder="Enter a website address or search"><button class="primary" id="openUrl">OPEN ↗</button></div><p>Opens directly in a separate tab, subject to your browser and network policies.</p></div><div class="tiles"><button class="tile" data-go="diagnostics"><strong>SERVER DIAGNOSTICS</strong><small>Check the app server and approved test endpoints.</small></button><button class="tile" data-go="settings"><strong>CONTROLS</strong><small>Change every keyboard shortcut.</small></button><button class="tile" data-go="bookmarks"><strong>BOOKMARKS</strong><small>Manage saved destinations.</small></button></div>`}
function settingsHtml(){return `<div class="card"><h3>KEYBOARD SHORTCUTS</h3><p>Click a shortcut field, then press the key combination you want. Avoid assigning the same combination to multiple actions. Changes save on this device.</p><div id="keyRows">${Object.entries(labels).map(([k,label])=>`<div class="keyrow"><span>${label}</span><input data-key="${k}" value="${esc(bindings[k])}" readonly aria-label="${label} shortcut"><button data-reset="${k}">DEFAULT</button></div>`).join('')}</div><div class="row" style="margin-top:14px"><button id="resetAll">RESTORE ALL DEFAULTS</button><span class="hint">Browser-reserved shortcuts may not be intercepted.</span></div></div><div class="card"><h3>APPEARANCE</h3><p>Theme: Xbox-inspired dark / neon green<br>Font: Kode Mono</p></div>`}
function diagnosticsHtml(){return `<div class="card"><h3>SERVER STATUS</h3><p>Checks whether the Chat's Proxy backend is reachable. This does not route website traffic.</p><div class="row"><button class="primary" id="runCheck">RUN DIAGNOSTICS</button><span class="hint" id="diagStatus">Ready</span></div><div id="diagResults"></div></div><div class="card"><h3>WHAT THIS TEST MEANS</h3><p>The backend checks only its own health and a fixed set of harmless test destinations. It does not accept arbitrary destination URLs, act as a general-purpose proxy, or hide browser requests from a school filter.</p></div>`}
function listHtml(type){let arr=type==='history'?historyItems:bookmarks;return `<div class="card"><h3>${type.toUpperCase()}</h3>${arr.length?arr.map((x,i)=>`<div class="item"><span>${esc(x.url)}<br><small>${esc(x.time||'')}</small></span>${type==='bookmarks'?`<button data-del="${i}">REMOVE</button>`:''}<button data-open="${i}" data-type="${type}">OPEN ↗</button></div>`).join(''):'<p>Nothing saved yet.</p>'}</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let names={home:'HOME',settings:'SETTINGS / KEYBINDS',diagnostics:'SERVER DIAGNOSTICS',history:'HISTORY',bookmarks:'BOOKMARKS',about:'ABOUT',launch:'OPEN WEBSITE'};$('#pageTitle').textContent=names[page]||'HOME';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let c=$('#content');c.innerHTML=page==='home'?homeHtml():page==='settings'?settingsHtml():page==='diagnostics'?diagnosticsHtml():page==='history'||page==='bookmarks'?listHtml(page):page==='launch'?`<div class="card"><h3>OPEN A WEBSITE</h3><div class="row"><input id="urlBox" style="flex:1" placeholder="Website address or search"><button class="primary" id="openUrl">OPEN ↗</button></div></div>`:`<div class="card"><h3>ABOUT CHAT'S PROXY V2</h3><p>This is a browser-style dashboard and security diagnostics app, not an anonymizing proxy. It does not conceal destinations or bypass network filtering.</p></div>`;
$('#openUrl')?.addEventListener('click',()=>openWebsite($('#urlBox').value));$('#urlBox')?.addEventListener('keydown',e=>{if(e.key==='Enter')openWebsite(e.target.value)});c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));c.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let arr=b.dataset.type==='history'?historyItems:bookmarks;openWebsite(arr[+b.dataset.open].url)});c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{bookmarks.splice(+b.dataset.del,1);localStorage.setItem('cp2_bookmarks',JSON.stringify(bookmarks));render()});
c.querySelectorAll('[data-key]').forEach(inp=>{inp.onclick=()=>{inp.value='Press keys…';inp.dataset.capturing='1';inp.focus()};inp.onkeydown=e=>{if(!inp.dataset.capturing)return;e.preventDefault();e.stopPropagation();if(['Control','Alt','Shift','Meta'].includes(e.key))return;let combo=normKey(e);let duplicate=Object.entries(bindings).find(([k,v])=>k!==inp.dataset.key&&v.toLowerCase()===combo.toLowerCase());if(duplicate){toast('Already assigned to '+labels[duplicate[0]]);inp.value=bindings[inp.dataset.key];delete inp.dataset.capturing;return}bindings[inp.dataset.key]=combo;inp.value=combo;delete inp.dataset.capturing;saveKeys()}});c.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{bindings[b.dataset.reset]=defaults[b.dataset.reset];saveKeys();render()});$('#resetAll')?.addEventListener('click',()=>{bindings={...defaults};saveKeys();render()});$('#runCheck')?.addEventListener('click',runDiagnostics)}
async function runDiagnostics(){let status=$('#diagStatus'),out=$('#diagResults');status.textContent='Checking…';out.innerHTML='';try{let r=await fetch('/api/diagnostics');let data=await r.json();status.textContent='Completed';out.innerHTML=`<div class="result"><b class="ok">● Backend reachable</b><br>Server time: ${esc(data.serverTime)}</div>`+data.checks.map(x=>`<div class="result"><b class="${x.ok?'ok':'bad'}">${x.ok?'●':'●'} ${esc(x.name)}: ${x.ok?'reachable':'not reachable'}</b><br>${esc(x.detail)}</div>`).join('')}catch(e){status.textContent='Backend unavailable';out.innerHTML='<div class="result"><b class="bad">● Could not reach backend.</b><br>Deploy the Node.js server and open this app from its Render URL.</div>'}}
document.addEventListener('keydown',e=>{if(e.target.matches('input[data-key]'))return;for(let [action,combo] of Object.entries(bindings)){if(keyMatches(e,combo)){e.preventDefault();e.stopPropagation();if(action==='newTab')openTab();if(action==='closeTab')closeTab();if(action==='back')history.back();if(action==='forward')history.forward();if(action==='refresh')location.reload();if(action==='focusAddress'){setPage('launch');setTimeout(()=>$('#urlBox')?.focus(),0)}if(action==='home')setPage('home');if(action==='settings')setPage('settings');return}}if(e.key==='Escape'&&page!=='home')setPage('home')},true);
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setPage(b.dataset.page));render();
fetch('/api/status').then(r=>r.json()).then(()=>$('#serverStatus').textContent='SERVER ONLINE').catch(()=>$('#serverStatus').textContent='SERVER OFFLINE');
</script>
</body></html>
